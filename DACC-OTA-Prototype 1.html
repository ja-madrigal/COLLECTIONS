<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DACC – Software Updates (OTA) Prototype</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;color:#e8eef6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
.ic{flex:none;display:inline-block;vertical-align:middle}

/* ---------- Desktop ---------- */
#desktop{position:fixed;inset:0;overflow:hidden;background:
 radial-gradient(60% 70% at 62% 78%,#0b4fd6 0%,#1c6cf2 22%,rgba(60,130,240,.55) 38%,transparent 60%),
 radial-gradient(40% 50% at 30% 85%,rgba(30,100,235,.8) 0%,transparent 60%),
 radial-gradient(35% 40% at 80% 40%,rgba(40,110,230,.55) 0%,transparent 65%),
 linear-gradient(180deg,#b9d0e6 0%,#9fbdd9 50%,#8eb1d2 100%)}
.desk-icons{position:absolute;top:18px;right:18px;display:flex;flex-direction:column;gap:14px}
.desk-icon{width:86px;padding:8px 4px;border-radius:4px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:default;user-select:none}
.desk-icon:hover{background:rgba(255,255,255,.18)}
.desk-icon .di{width:44px;height:44px;margin:0 auto 6px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,#16324f,#0b1726);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.desk-icon .di.bin{background:linear-gradient(160deg,#dfe8f2,#a8bacd);color:#30475f}

/* Taskbar */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(232,238,246,.86);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:#1b1f24;z-index:50}
.tb-center{display:flex;gap:4px}
.tb-btn{width:40px;height:40px;border-radius:5px;display:grid;place-items:center;position:relative}
.tb-btn:hover{background:rgba(255,255,255,.7)}
.tb-btn.on::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:#7a8592}
.tb-btn.active::after{width:16px;background:#0067c0}
.tb-dacc{display:none}.tb-dacc.on{display:grid}
.tb-right{position:absolute;right:8px;display:flex;align-items:center;gap:2px;font-size:12px}
.tray{height:40px;padding:0 6px;border-radius:5px;display:flex;align-items:center;gap:8px;position:relative}
.tray:hover{background:rgba(255,255,255,.7)}
.tray .badge{position:absolute;top:5px;right:2px;min-width:14px;height:14px;border-radius:7px;background:#d4351c;color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px;font-weight:700}
.clock{text-align:right;line-height:1.3;padding:0 8px}

/* OS toasts */
#ostoasts{position:absolute;right:12px;bottom:60px;display:flex;flex-direction:column;gap:10px;z-index:60}
.ostoast{width:364px;background:rgba(243,246,250,.97);color:#1b1f24;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:14px 16px;animation:tIn .25s ease}
.ostoast .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:#555;margin-bottom:8px}
.ostoast .hd .x{margin-left:auto;color:#666}
.ostoast b{display:block;font-size:14px;margin-bottom:3px}
.ostoast p{font-size:13px;color:#444;line-height:1.4}
.ostoast .acts{display:flex;gap:8px;margin-top:12px}
.ostoast .acts button{flex:1;padding:6px;border-radius:4px;background:#e1e6ec;font-size:13px}
.ostoast .acts button.p{background:#0067c0;color:#fff}
@keyframes tIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* Fullscreen overlay (restart / servicing / recovery) */
#overlay{position:fixed;inset:0;z-index:100;background:#000;display:none;color:#fff}
#overlay.show{display:block}
.boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.boot-t{font-size:16px;color:#cfd8e3;min-height:20px}
.dell-logo{font-weight:700;letter-spacing:-1px;line-height:1;display:inline-flex;flex-direction:column;align-items:center}
.dell-logo .w{font-size:34px}.dell-logo .w i{display:inline-block;transform:rotate(-28deg);font-style:normal}
.dell-logo small{font-size:17px;font-weight:300;letter-spacing:0;margin-top:2px}
.dell-logo.big .w{font-size:56px}.dell-logo.big small{font-size:24px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#41a5f5;animation:spin 1s linear infinite}
.spinner.sm{width:14px;height:14px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.svc{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(70% 70% at 50% 40%,#0f2440,#050b14)}
.svc-box{width:620px}
.svc-box h2{font-weight:300;font-size:34px;margin:26px 0 6px}
.svc-box .lead{color:#9fb0c5;font-size:14px;margin-bottom:22px}
.svc-steps{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.svc-steps li{display:flex;align-items:center;gap:10px;font-size:14px;color:#7e8ea3}
.svc-steps li[data-st=run]{color:#fff}.svc-steps li[data-st=done]{color:#b7e3a1}
.svc-steps .sic{width:18px;height:18px;display:grid;place-items:center}

/* ---------- DACC window ---------- */
#win{position:absolute;left:50%;top:calc(50% - 24px);transform:translate(-50%,-50%);width:min(1000px,65vw);height:min(650px,calc(100vh - 80px));border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
 background:radial-gradient(900px 500px at 75% 10%,rgba(33,64,104,.55),transparent 70%),linear-gradient(165deg,#132338 0%,#0d1a2b 55%,#0a1422 100%);
 box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);z-index:20}
#win.hidden{display:none}
#win.max{left:0!important;top:0!important;transform:none!important;width:100%;height:calc(100% - 48px);border-radius:0}
.titlebar{height:40px;flex:none;display:flex;align-items:center;padding:0 6px 0 14px;font-size:12px;color:#c9d4e2;user-select:none;position:relative}
.titlebar .ttl{flex:1}
.tsearch{position:absolute;left:50%;transform:translateX(-50%);width:270px;height:26px;border-radius:4px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;padding:0 10px;color:#8d9cb0}
.tsearch input{background:none;border:none;outline:none;flex:1;font-size:12px;color:#e8eef6}
.tsearch input::placeholder{color:#7d8ca1}
.admin{background:#1f6fe0;color:#fff;font-size:10px;padding:2px 8px;border-radius:9px;margin-right:12px}
.tbtn{width:34px;height:30px;display:grid;place-items:center;border-radius:4px;color:#c9d4e2}
.tbtn:hover{background:rgba(255,255,255,.08)}.tbtn.cls:hover{background:#c42b1c;color:#fff}
.wbody{flex:1;position:relative;overflow:hidden}
#app{position:absolute;inset:0}
.scroll{position:absolute;inset:0;overflow:auto;padding:26px 44px 0}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}

.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.splash .spinner{margin-top:70px;width:18px;height:18px;border-width:2px}
.splash .foot{position:absolute;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:#dbe4ef}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #4d8fe0;border-radius:14px;padding:4px 12px;font-size:12px}

/* Home */
.home{display:grid;grid-template-columns:240px 1fr;gap:44px;min-height:calc(100% - 26px);padding:10px 0 26px}
.home-left{display:flex;flex-direction:column}
.eyebrow{font-size:12px;letter-spacing:1.6px;color:#8fc1ef;text-transform:uppercase;margin-bottom:8px}
.device{font-weight:300;font-size:30px;line-height:1.2;margin-bottom:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 10px;font-size:12px;margin-bottom:28px}
.kv dt{font-weight:600}.kv dd{color:#b9c6d6}
.mini{background:rgba(255,255,255,.05);border-radius:6px;padding:14px;font-size:13px;margin-bottom:12px}
.mini .r{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mini a{color:#b9c6d6;text-decoration:underline;cursor:pointer;font-size:12px}
.notif-link{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:8px 6px;border-radius:4px;align-self:flex-start;position:relative}
.notif-link:hover{background:rgba(255,255,255,.06)}
.ndot{background:#d4351c;color:#fff;font-size:10px;border-radius:8px;padding:1px 6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.tile{background:linear-gradient(180deg,#142c4d,#11264a);border-radius:8px;padding:0 20px;height:72px;display:flex;align-items:center;gap:14px;font-size:17px;font-weight:500;text-align:left;transition:background .15s;position:relative}
.tile:hover{background:#1a3760}
.tile .chev{margin-left:auto;color:#c9d4e2}
.tile .dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:#d4351c}
.feat-ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;position:relative}
.feat-ic .badge{position:absolute;top:-3px;right:-5px;background:#d4351c;color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px}
.utils{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.util{border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:11px;font-size:12px;color:#d7e0eb;display:flex;flex-direction:column;align-items:center;gap:6px}
.util:hover{background:rgba(255,255,255,.04)}.util b{font-weight:600;color:#fff}

/* Generic page */
.page-head{display:flex;align-items:center;gap:12px}
.page-head h1{font-weight:300;font-size:40px;letter-spacing:-.3px}
.back{width:30px;height:30px;display:grid;place-items:center;border-radius:4px}.back:hover{background:rgba(255,255,255,.08)}
.sub{color:#b9c6d6;font-size:13px;margin:2px 0 16px 42px}
.btn{border:1px solid rgba(255,255,255,.85);border-radius:3px;padding:8px 18px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.08)}
.btn.primary{background:#0672cb;border-color:#0672cb;color:#fff}.btn.primary:hover:not(:disabled){background:#0a80e0}
.btn.danger{background:#b3261e;border-color:#b3261e}.btn.danger:hover:not(:disabled){background:#c9302a}
.btn.ghost{border-color:transparent}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.link{color:#6cb4f5;font-size:12px;cursor:pointer;text-decoration:none;background:none;border:none;padding:0}
.link:hover{text-decoration:underline}
.link:disabled{color:#64748a;cursor:not-allowed;text-decoration:none}

.status{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.st-main{display:flex;align-items:center;gap:12px;flex:1}
.st-main b{font-size:15px;font-weight:500;display:block}
.st-main small{font-size:12px;color:#9fb0c5}
.sdot{width:10px;height:10px;border-radius:50%;flex:none}
.sdot.g{background:#6fcf5a}.sdot.a{background:#f2b33d}.sdot.r{background:#ef5350}
.tagp{font-size:11px;border-radius:10px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);color:#cfd9e6;white-space:nowrap}
.tagp.on{background:rgba(242,179,61,.15);color:#f6c96d}
.tagp.off{background:rgba(111,207,90,.13);color:#9be08a}
.tagp.wms{background:rgba(66,153,240,.15);color:#8fc6fa}

.banner{display:flex;gap:12px;align-items:flex-start;border-radius:6px;padding:11px 14px;font-size:13px;margin-bottom:10px;line-height:1.45;border-left:3px solid}
.banner b{font-weight:600}
.banner .bx{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.banner.info{background:rgba(42,120,214,.13);border-color:#3d8fe8}
.banner.warn{background:rgba(242,179,61,.10);border-color:#f2b33d}
.banner.err{background:rgba(239,83,80,.12);border-color:#ef5350}
.banner.ok{background:rgba(111,207,90,.10);border-color:#6fcf5a}

.tabs{display:flex;background:#132b4c;border-radius:4px;margin:14px 0 16px;overflow:hidden}
.tab{flex:1;padding:9px;font-size:13px;text-align:center;color:#dbe4ef}
.tab:hover{background:rgba(255,255,255,.04)}
.tab.active{background:#0a6fc2;color:#fff;font-weight:500}
.tab .cnt{font-size:11px;background:rgba(255,255,255,.18);border-radius:8px;padding:1px 7px;margin-left:6px}

.avail{display:grid;grid-template-columns:200px 1fr;gap:18px;padding-bottom:12px}
.cats{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:0}
.cat{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;font-size:13px;color:#cfd9e6;text-align:left}
.cat:hover{background:rgba(255,255,255,.05)}
.cat.active{background:rgba(10,111,194,.3);color:#fff;box-shadow:inset 3px 0 0 #2b8fef}
.cat .n{margin-left:auto;font-size:11px;color:#9fb0c5}
.cat .n.crit{color:#ff8f8f}
.cat-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
.cats .link{padding:4px 10px;text-align:left}

table.grid{width:100%;border-collapse:collapse;font-size:13px}
.grid th{text-align:left;font-weight:500;padding:9px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:#dfe8f3;white-space:nowrap}
.grid td{padding:10px 12px;border:1px solid rgba(255,255,255,.12);vertical-align:middle}
.grid tr.click{cursor:pointer}.grid tr.click:hover td{background:rgba(255,255,255,.035)}
.grid tr.selrow td{background:rgba(10,111,194,.12)}
.grid tr.flash td{animation:rowFlash 2.6s ease-out}
@keyframes rowFlash{0%,35%{background:rgba(43,143,239,.42)}100%{background:rgba(10,111,194,.12)}}
.grid tr.grp td{background:rgba(10,111,194,.12);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8fc1ef;padding:7px 12px}
.grid .nm{font-weight:500}
.grid .ver{font-size:12px;color:#9fb0c5;margin-top:2px}.grid .ver b{color:#e8eef6;font-weight:500}
.grid .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.grid input[type=checkbox]{width:15px;height:15px;accent-color:#0a6fc2;cursor:pointer}
.grid .muted{color:#9fb0c5}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;white-space:nowrap;min-width:96px;text-align:center}
.chip.c-crit{background:rgba(239,83,80,.16);color:#ff9a97;border:1px solid rgba(239,83,80,.45)}
.chip.c-rec{background:rgba(124,196,74,.14);color:#b4e58f;border:1px solid rgba(124,196,74,.45)}
.chip.c-opt{background:rgba(66,153,240,.14);color:#8fc6fa;border:1px solid rgba(66,153,240,.45)}
.imp{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.imp.live{color:#9be08a}.imp.restart{color:#f6c96d}.imp.reimage{color:#ff9a97}
.mtag{font-size:11px;padding:2px 8px;border-radius:3px;background:rgba(255,255,255,.07);color:#cfd9e6;display:inline-flex;gap:4px;align-items:center}
.mtag.g{background:rgba(111,207,90,.13);color:#9be08a}.mtag.b{background:rgba(66,153,240,.15);color:#8fc6fa}.mtag.a{background:rgba(242,179,61,.13);color:#f6c96d}
.empty{padding:50px 20px;text-align:center;color:#9fb0c5;border:1px dashed rgba(255,255,255,.12);border-radius:8px}
.empty .ic{color:#6fcf5a;margin-bottom:10px}
.empty b{display:block;color:#e8eef6;font-size:15px;font-weight:500;margin-bottom:4px}

.footer-bar{position:sticky;bottom:0;margin:0 -44px;padding:12px 44px;background:linear-gradient(180deg,rgba(13,26,43,.85),#0c1828);backdrop-filter:blur(6px);border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:18px;z-index:2}
.footer-bar .sum{flex:1;font-size:13px;color:#b9c6d6;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.footer-bar .sum b{color:#fff;font-weight:500}
.footer-bar .big{font-size:17px;color:#6cb4f5;font-weight:500}
.footer-bar .acts{display:flex;gap:10px}

.oscard{background:rgba(22,52,92,.45);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.oscard h3{font-size:15px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.osgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:12px}
.osgrid span{display:block;color:#9fb0c5;margin-bottom:2px}
.img-row{display:flex;gap:16px;align-items:center;background:#132d52;border-radius:6px;padding:14px 16px;margin-bottom:8px}
.img-row .meta{flex:1}
.img-row .meta b{font-size:14px;font-weight:500}
.img-row .meta small{display:block;color:#9fb0c5;font-size:12px;margin-top:3px}
.img-row ul{margin:8px 0 0 16px;font-size:12px;color:#cfd9e6;line-height:1.6}

/* Prefs */
.pref-sec{background:rgba(22,52,92,.45);border-radius:8px;margin-bottom:14px;overflow:hidden}
.pref-sec h3{font-size:14px;font-weight:500;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
.pref-sec h3 .lk{margin-left:auto;font-size:11px;font-weight:400;color:#8fc6fa;display:flex;gap:5px;align-items:center}
.prow{display:flex;align-items:center;gap:16px;padding:11px 16px;font-size:13px;background:#132d52;margin:8px 10px;border-radius:5px}
.prow .pl{flex:1}.prow .pl small{display:block;font-size:11px;color:#9fb0c5;margin-top:2px}
.sel,.inp{background:#21344d;border:1px solid rgba(255,255,255,.18);border-radius:3px;padding:6px 10px;font-size:12px;min-width:200px;outline:none}
.inp{background:#0d1a2c;border-color:rgba(255,255,255,.4)}
.sel:disabled,.inp:disabled{opacity:.5}
.sel option{background:#1a2c44}
.tg{width:34px;height:18px;border-radius:9px;background:#8a97a8;position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:#0a6fc2}.tg.on::after{left:18px}
.tg:disabled{opacity:.45}
.tgw{display:flex;align-items:center;gap:8px;font-size:12px}

/* Drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(640px,62%);background:#0f1f36;box-shadow:-20px 0 50px rgba(0,0,0,.45);z-index:10;display:flex;flex-direction:column;animation:dIn .2s ease}
@keyframes dIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.dr-scroll{flex:1;overflow:auto;padding:16px 26px}
.drawer h2{font-weight:300;font-size:26px;margin:12px 0 12px}
.dmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:12px;margin-bottom:12px}
.dmeta span{color:#9fb0c5}
.desc{font-size:13px;color:#cfd9e6;line-height:1.5;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.dr-body{display:grid;grid-template-columns:170px 1fr;gap:18px}
.dr-nav{display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.08)}
.dr-nav button{text-align:left;padding:9px 10px;font-size:13px;color:#b9c6d6}
.dr-nav button.active{color:#6cb4f5;box-shadow:inset -2px 0 0 #2b8fef}
.dr-sec h4{font-size:15px;font-weight:500;margin-bottom:10px}
.dr-sec ul{margin-left:18px;font-size:13px;line-height:1.7;color:#dbe4ef}
.dr-sec p{font-size:13px;line-height:1.55;color:#dbe4ef;margin-bottom:8px}
.mono{font-family:Consolas,monospace;font-size:12px;word-break:break-all;color:#cfd9e6}
.dr-foot{padding:12px 26px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:center}
.dr-foot .note{flex:1;font-size:12px;color:#9fb0c5;display:flex;gap:6px;align-items:center}

/* Notification panel */
.npanel{position:absolute;top:0;right:0;bottom:0;width:340px;background:#0f1f36;box-shadow:-20px 0 50px rgba(0,0,0,.45);z-index:11;display:flex;flex-direction:column;animation:dIn .2s ease}
.npanel .nh{display:flex;align-items:center;padding:16px 18px 8px;font-size:18px}

.jlist{display:flex;flex-direction:column;gap:6px}
.jr{background:#132d52;border-radius:5px;padding:10px 12px;font-size:13px}
.jr .top{display:flex;align-items:center;gap:10px}
.jr .top .n{flex:1;font-weight:500}
.jr .top .s{font-size:12px;color:#9fb0c5}
.jr .jr-t{font-size:12px;color:#9fb0c5;margin:6px 0 0 26px}
.jr[data-st=ok] .jr-t{color:#9be08a}.jr[data-st=fail] .jr-t{color:#ff9a97}
.jr-ic{width:16px;height:16px;display:grid;place-items:center}
.bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:7px 0 0 26px}
.bar i{display:block;height:100%;width:0;background:#2b8fef;transition:width .12s linear}
.jr[data-st=ok] .bar i{background:#6fcf5a}.jr[data-st=fail] .bar i{background:#ef5350}
.bar.big{height:6px;margin:0}
.checks{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;gap:10px;align-items:flex-start;background:#132d52;border-radius:5px;padding:9px 12px;font-size:13px}
.ck .ci{width:18px;flex:none;padding-top:1px}
.ck b{font-weight:500;display:block}.ck small{color:#b9c6d6;font-size:12px;line-height:1.45;display:block}
.ck.pass .ci{color:#6fcf5a}.ck.warn .ci{color:#f2b33d}.ck.fail .ci{color:#ef5350}.ck.pend{opacity:.6}
.ack{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:#e8eef6}

.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#132d52;border-radius:5px;margin-bottom:6px;font-size:13px;cursor:pointer}

.warnbox{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.4);border-radius:5px;padding:12px 14px;font-size:13px;line-height:1.5;display:flex;gap:10px;margin:10px 0}

.res small{display:block;color:#9fb0c5;font-size:12px;margin-top:2px}
.res .ok{color:#6fcf5a}.res .bad{color:#ef5350}

/* In-app toast (theme) */
#atoasts{position:absolute;right:20px;bottom:20px;z-index:40;display:flex;flex-direction:column;gap:8px}
.atoast{min-width:300px;max-width:420px;background:#13243c;border-left:4px solid #6ea204;border-radius:4px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tIn .2s ease}

.proto-h{background:#7cf2b7;padding:9px 12px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.proto-b{background:#e9fff3;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.proto label{display:flex;justify-content:space-between;align-items:center;gap:8px}

.proto button:hover{background:#d4f7e4}
.proto .hint{color:#4a6b59;font-size:11px;line-height:1.4}

.fb-menu button:hover{background:#f0edff}
.fb-menu small{display:block;color:#6b7380;font-size:11px}
.fb-menu hr{border:none;border-top:1px solid #eceef2;margin:4px 0}
.fb-dim{position:fixed;inset:0;z-index:9500;background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center}

.fb-dlg p{line-height:1.5;color:#3b4350}

.fb-btn.p{background:#5b3df5;border-color:#5b3df5;color:#fff!important}.fb-btn.p:hover{background:#4a2ee0}
.fb-btn.d{color:#c62828!important;border-color:#f0c4c4}

.fb-panel .flt{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 18px;border-bottom:1px solid #eceef2;font-size:12px}
.fb-panel .flt select{padding:5px 6px;font-size:12px}
.fb-panel .flt label{display:flex;gap:6px;align-items:center;grid-column:1/-1;color:#4b5361}

   <button class="tile" data-act="na">${ic('wand',20)} Easy Setup <span class="chev">${ic('chev',18)}</span></button>
   <button class="tile" data-act="na">${ic('sliders',20)} WMS Settings <span class="chev">${ic('chev',18)}</span></button>
   <button class="tile" data-act="na">${ic('info',20)} Device Overview <span class="chev">${ic('chev',18)}</span></button>
   <button class="tile" data-act="wfToggle">${ic('wf',20)} Write Filter Settings <span class="chev">${ic('chev',18)}</span></button>
  </div>
  <div class="eyebrow">Utilities</div>
  <div class="utils">
   <button class="util" data-act="na">${ic('shortcut')}<span>Manage <b>Windows Shortcut</b></span></button>
   <button class="util" data-act="na">${ic('login')}<span>Enable <b>Auto-Login</b></span></button>
   <button class="util" data-act="exportLogs">${ic('logs')}<span>Export <b>Device Logs</b></span></button>
   <button class="util" data-act="na">${ic('image')}<span>Manage <b>Image Settings</b></span></button>
   <button class="util" data-act="na">${ic('tools')}<span>Setup <b>ALM</b></span></button>
  </div>
 </div></div></div>`}

function vUpdates(){
 const a=avail(),crit=a.filter(i=>i.imp==='crit').length,n=totalAvail(),rp=restartPending();
 let dot='g',head='Your device is up to date';
 if(n){dot=crit?'r':'a';head=crit?`${crit} critical update${crit>1?'s':''} · ${n} total available`:`${n} update${n>1?'s':''} available`}
 if(rp.length){dot='a';head='Restart required to finish installing updates'}
 const wmsPill={none:`<span class="tagp">Locally managed</span>`,registered:`<span class="tagp wms">${ic('sliders',12)} WMS · local control</span>`,managed:`<span class="tagp wms">${ic('lock',12)} Managed by WMS</span>`}[S.wms];
 const tabs=[['available',`Available<span class="cnt">${n}</span>`],['installed','Installed'],['history','History'],['prefs','Preferences']];
 let body={available:tAvail,installed:tInstalled,history:tHistory,prefs:tPrefs}[S.tab]();
 return `<div class="scroll">
 <div class="page-head"><button class="back" data-act="go" data-view="home">${ic('back',20)}</button><h1>Software Updates</h1></div>
 <p class="sub">Over-the-air updates for Dell apps, VDI &amp; UC clients, browser and OS images on this device.</p>
 <div class="status">
  <div class="st-main"><span class="sdot ${dot}"></span><div><b>${head}</b><small>Last checked ${relT(S.lastChecked)} · Source: ${esc(srcName())}</small></div></div>
  <span class="tagp ${S.wf?'on':'off'}">${ic('wf',12)} Write Filter ${S.wf?'ON':'OFF'}</span>${wmsPill}
  ${rp.length?`<button class="btn sm primary" data-act="restart">${ic('power',14)} Restart now</button>`:''}
  <button class="btn sm" data-act="check" ${S.checking?'disabled':''}>${S.checking?spin()+' Checking…':ic('refresh',14)+' Check for updates'}</button>
 </div>
 ${banners()}
 <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k?'active':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div>
 ${body}
 </div>`}

function banners(){
 let h='';
 if(S.net==='offline')h+=`<div class="banner err">${ic('net',18)}<div><b>No network connection.</b> Updates can't be checked or downloaded. Already-downloaded updates can still be installed.</div></div>`;
 if(managed())h+=`<div class="banner info">${ic('lock',18)}<div><b>Updates on this device are managed by Wyse Management Suite</b> (group <b>Finance-TC</b>, policy “Thin Client OTA – Ring 2”). WMS-assigned updates install in the maintenance window <b>${windowLabel()}</b>. Local installs and preferences are locked by policy.</div></div>`;
 if(S.wf&&S.tab==='available'&&totalAvail())h+=`<div class="banner warn">${ic('wf',18)}<div><b>Write Filter is ON.</b> Please disable it to apply updates.</div><div class="tgw" style="margin-left:auto">${S.wf?'ON':'OFF'}<button class="tg ${S.wf?'on':''}" data-act="wfToggle"></button></div></div>`;
 if(S.scheduled)h+=`<div class="banner info">${ic('cal',18)}<div><b>${S.scheduled.ids.length} update${S.scheduled.ids.length>1?'s':''} scheduled</b> for ${S.scheduled.when}${S.scheduled.prefetch?' · pre-downloaded':''}.</div><div class="bx"><button class="link" data-act="runWindow">Run now</button><button class="link" data-act="unschedule">Cancel schedule</button></div></div>`;
 return h}

function rowTags(i){let t=[];
 if(i.restartPending)t.push(`<span class="mtag a">${ic('power',11)} Restart pending</span>`);
 if(i.downloaded)t.push(`<span class="mtag g">${ic('check',11)} Downloaded · ready to install</span>`);
 if(isSched(i.id))t.push(`<span class="mtag b">${ic('cal',11)} Scheduled · ${S.scheduled.when}</span>`);
 if(managed()&&i.wms&&i.next)t.push(`<span class="mtag b">${ic('lock',11)} WMS-assigned · ${windowLabel()}</span>`);
 if(i.proc&&i.next)t.push(`<span class="mtag a">${ic('apps',11)} Running</span>`);
 if(i.skipped)t.push(`<span class="mtag">${ic('skip',11)} Skipped</span>`);
 return t.length?`<div class="tags">${t.join('')}</div>`:''}

function tAvail(){
 const a=avail(),os=osUpdate(),q=S.q.trim().toLowerCase();
 const isSec=S.cat==='security';
 const baseList=S.items.filter(i=>i.next&&(!i.skipped||S.showSkipped));
 const list=baseList.filter(i=>isSec?i.imp==='crit':S.cat==='all'||i.cat===S.cat);
 const impList=S.impFilter==='all'?list:list.filter(i=>i.imp===S.impFilter);
 const count=c=>c==='all'?a.length+(os?1:0):c==='os'?(os?1:0):c==='security'?a.filter(i=>i.imp==='crit').length:a.filter(i=>i.cat===c).length;
 const critC=c=>a.filter(i=>(c==='all'||c==='security'||i.cat===c)&&i.imp==='crit').length;
 const cats=CATS.map(c=>`<button class="cat ${S.cat===c.id?'active':''}" data-act="cat" data-cat="${c.id}">${ic(c.i)} ${c.l}<span class="n ${critC(c.id)?'crit':''}">${count(c.id)}</span></button>`).join('');
 const sk=skippedList().length;
 const impOpts=[['all','All'],['crit','Critical'],['rec','Recommended'],['opt','Optional']];
 const side=`<aside class="cats">${cats}<div class="cat-sep"></div>
  ${S.sel.size?`<button class="link" data-act="selNone">Deselect all</button>`:''}
  ${sk?`<button class="link" data-act="toggleSkipped">${S.showSkipped?'Hide':'Show'} skipped (${sk})</button>`:''}</aside>`;
 if(S.cat==='os')return `<div class="avail">${side}<section>${osPanel()}</section></div>`;
 let workList=impList;
 if(q)workList=workList.filter(i=>(i.name+' '+i.vendor).toLowerCase().includes(q));
 const order={crit:0,rec:1,opt:2};
 let rows='';
 const groups=isSec?['dell','vdi','browser','drivers','bios','firmware','oskb']:S.cat==='all'?['dell','vdi','browser','drivers','bios','firmware','oskb']:[S.cat];
 groups.forEach(g=>{const gl=workList.filter(i=>i.cat===g).sort((x,y)=>order[x.imp]-order[y.imp]);if(!gl.length)return;
  if(S.cat==='all'||isSec)rows+=`<tr class="grp"><td colspan="7">${CATL[g]}</td></tr>`;
  gl.forEach(i=>{rows+=`<tr class="click ${S.sel.has(i.id)?'selrow':''}" id="row-${i.id}" data-act="details" data-id="${i.id}">
   <td style="width:38px"><input type="checkbox" data-act="sel" data-id="${i.id}" ${S.sel.has(i.id)?'checked':''} ${managed()||i.skipped?'disabled':''}></td>
   <td><div class="nm">${i.name}${i.sub?` <span class="muted" style="font-weight:400;font-size:12px">(${i.sub})</span>`:''}</div><div class="ver">${i.cur} → <b>${i.next}</b> · ${i.vendor}</div>${rowTags(i)}</td>
   <td>${chip(i.imp)}</td><td>${impact(i.impact)}</td><td class="muted">${fmtMB(i.size)}</td><td class="muted">${fmtD(i.date)}</td><td style="width:34px">${ic('chev')}</td></tr>`})});
 const osCard=(S.cat==='all'&&os&&!q)?`<div class="img-row" style="margin-top:12px">${ic('win',22)}<div class="meta"><b>OS image update available — ${os.label}</b><small>Current: ${S.os.cur.label} · ${fmtMB(os.size)} · Requires reimage (erases system drive)</small></div><button class="btn sm" data-act="cat" data-cat="os">Review OS images ${ic('chev',14)}</button></div>`:'';
 const table=rows?`<table class="grid"><thead><tr><th><input type="checkbox" data-act="selVisible" ${managed()?'disabled':''} ${workList.length&&workList.filter(i=>!i.skipped).every(i=>S.sel.has(i.id))?'checked':''}></th><th>Update</th><th>Importance <select id="impFilterSelect" class="sel" style="min-width:0;width:100px;margin-left:8px;background:#21344d;border-color:rgba(255,255,255,.18);font-size:11px;padding:3px 6px">${[['all','All'],['crit','Critical'],['rec','Recommended'],['opt','Optional']].map(([v,l])=>`<option value="${v}" ${S.impFilter===v?'selected':''}>${l}</option>`).join('')}</select></th><th>Post Install</th><th>Size</th><th>Released</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
  :`<div class="empty">${ic('checkc',36)}<b>${q?'No updates match “'+esc(S.q)+'”':'Everything here is up to date'}</b>${q?'':'We\'ll notify you when new updates are published.'}</div>`;
 return `<div class="avail">${side}<section>${table}${osCard}</section></div>${footer()}`}

function footer(){
 if(managed()){const w=avail().filter(i=>i.wms);
  return `<div class="footer-bar"><div class="sum">${ic('lock')} <span>Deployed by WMS policy · <b>${w.length}</b> assigned update${w.length!==1?'s':''} · next window <b>${windowLabel()}</b></span></div>
  <div class="acts"><button class="btn primary" data-act="installAssigned" ${w.length&&!S.wf?'':'disabled'}>Install assigned now${w.length?` (${w.length})`:''}</button></div></div>`}
 const sel=[...S.sel].map(item).filter(Boolean),size=sel.reduce((a,i)=>a+i.size,0),rs=sel.some(i=>i.impact==='restart'),ok=sel.length&&!S.wf;
 return `<div class="footer-bar"><div class="sum">${sel.length?`<span><b>${sel.length}</b> update${sel.length>1?'s':''} selected</span><span class="big">${fmtMB(size)}</span><span>${ic('clock',14)} ~${estMin(sel)} min</span><span>${rs?`${ic('power',14)} Restart required`:`${ic('check',14)} No restart`}</span>`:'<span>Select updates to download or install</span>'}${S.wf?`<span style="color:#f6c96d">${ic('lock',14)} Disable Write Filter to install</span>`:''}</div>
 <div class="acts"><button class="btn" data-act="downloadOnly" ${ok?'':'disabled'}>${ic('download',14)} Download only</button><button class="btn" data-act="schedule" ${ok?'':'disabled'}>${ic('cal',14)} Schedule…</button><button class="btn primary" data-act="install" ${ok?'':'disabled'}>Install now${sel.length?` (${sel.length})`:''}</button></div></div>`}

const chip=k=>`<span class="chip c-${k}">${IMP[k]}</span>`;
const impact=k=>({live:`<span class="imp live">${ic('check',13)} No restart</span>`,restart:`<span class="imp restart">${ic('power',13)} Restart required</span>`,reimage:`<span class="imp reimage">${ic('warn',13)} Reimage</span>`})[k];

function osPanel(){const c=S.os.cur,up=osUpdate();
 return `<div class="oscard"><h3>${ic('win')} Current OS image</h3><div class="osgrid">
  <div><span>Image</span>${c.label}</div><div><span>OS</span>${DEVICE.os}</div><div><span>Build</span>${c.build}</div><div><span>Applied</span>${c.date} · ${c.by}</div></div></div>
 ${managed()?`<div class="banner info">${ic('lock',18)}<div>OS image deployment is controlled by the WMS <b>OS Image policy</b>. Contact your WMS administrator to schedule a reimage.</div></div>`:''}
 <div class="sec-t">Images from Dell Support for ${DEVICE.model} (service tag ${DEVICE.tag})</div>
 ${S.os.images.map(m=>{const isCur=m.id===c.id,older=m.id<c.id;return `<div class="img-row">${ic('disk',22)}<div class="meta">
   <b>${m.label}</b> ${m.latest?'<span class="mtag b">Latest</span>':''} ${isCur?'<span class="mtag g">Installed</span>':''}
   <small>${DEVICE.os} · Build ${m.build} · ${fmtD(m.date)} · ${fmtMB(m.size)} · ${impact('reimage')}</small>
   <ul>${m.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>
   ${isCur?'':`<button class="btn ${m.latest&&!older?'primary':''} sm" data-act="reimage" data-img="${m.id}" ${managed()?'disabled':''}>${older?'Reimage to older…':'Reimage device…'}</button>`}</div>`}).join('')}
 ${up?'':`<div class="banner ok" style="margin-top:8px">${ic('checkc',18)}<div>This device is running the latest Dell OS image.</div></div>`}
 <p class="muted" style="font-size:12px;margin:10px 0 20px;color:#9fb0c5">Reimaging replaces the operating system and erases the system drive. Windows quality updates on top of an image are delivered by Windows Update / WMS and are outside this module.</p>`}

function tInstalled(){
 const rows=['dell','vdi','browser','drivers','bios','firmware','oskb'].map(g=>`<tr class="grp"><td colspan="6">${CATL[g]}</td></tr>`+S.items.filter(i=>i.cat===g).map(i=>{
  const idx=i.versions.findIndex(v=>v[0]===i.cur),prev=i.versions[idx+1];
  const st=i.restartPending?`<span class="mtag a">${ic('power',11)} Restart pending</span>`:i.next&&!i.skipped?`<span class="mtag b">Update available · ${i.next}</span>`:`<span class="mtag g">${ic('check',11)} Up to date</span>`;
  return `<tr><td><div class="nm">${i.name}</div><div class="ver">${i.vendor}</div></td><td>${i.cur}</td><td>${st}</td>
  <td><select class="sel" style="min-width:150px" data-pol="${i.id}" ${managed()?'disabled':''}>${[['auto','Install automatically'],['notify','Notify only'],['manual','Manual']].map(([v,l])=>`<option value="${v}" ${(i.policy||'notify')===v?'selected':''}>${l}</option>`).join('')}</select></td>
  <td><button class="link" data-act="details" data-id="${i.id}">Details</button>${prev?` &nbsp;·&nbsp; <button class="link" data-act="rollback" data-id="${i.id}" ${managed()?'disabled':''}>Roll back to ${prev[0]}</button>`:''}</td></tr>`}).join('')).join('');
 return `<table class="grid" style="margin-bottom:24px"><thead><tr><th>Component</th><th>Installed version</th><th>Status</th><th>Update policy ${managed()?ic('lock',12):''}</th><th>Actions</th></tr></thead><tbody>
 <tr class="grp"><td colspan="6">OS Image</td></tr><tr><td><div class="nm">${S.os.cur.label}</div><div class="ver">${DEVICE.os}</div></td><td>Build ${S.os.cur.build}</td><td>${osUpdate()?`<span class="mtag b">New image · ${osUpdate().label}</span>`:`<span class="mtag g">${ic('check',11)} Latest</span>`}</td><td class="muted">Manual (reimage)</td><td><button class="link" data-act="cat" data-cat="os">View images</button></td></tr>
 ${rows}</tbody></table>`}

function tHistory(){
 return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="muted" style="font-size:12px;color:#9fb0c5">${S.history.length} events · results are ${S.wms==='none'?'stored locally':'reported to WMS'}</span><button class="btn sm" data-act="exportLogs">${ic('download',14)} Export update logs</button></div>
 <table class="grid" style="margin-bottom:24px"><thead><tr><th>Date &amp; time</th><th>Update</th><th>Change</th><th>Result</th><th>Initiated by</th><th>WMS</th></tr></thead><tbody>
 ${S.history.map(h=>`<tr><td class="muted">${fmtDT(h.d)}</td><td class="nm">${h.name}</td><td class="muted">${h.from} → ${h.to}</td>
 <td>${h.r==='ok'?`<span class="mtag g">${ic('check',11)} Success</span>`:h.r==='rb'?`<span class="mtag b">${ic('undo',11)} Rolled back</span>`:`<span class="mtag" style="background:rgba(239,83,80,.15);color:#ff9a97">${ic('close',11)} Failed</span><div class="ver">${h.err}</div>`}</td>
 <td class="muted">${h.by}</td><td>${h.rep?`<span class="muted">${ic('check',13)} Reported</span>`:'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table>`}

function tPrefs(){const p=S.prefs,L=managed(),d=L?'disabled':'';
 const sel=(k,opts)=>`<select class="sel" data-pref="${k}" ${d}>${opts.map(([v,l,dis])=>`<option value="${v}" ${p[k]===v?'selected':''} ${dis?'disabled':''}>${l}</option>`).join('')}</select>`;
 const tg=k=>`<span class="tgw">${p[k]?'ON':'OFF'}<button class="tg ${p[k]?'on':''}" data-act="prefTg" data-k="${k}" ${d}></button></span>`;
 const lk=L?`<span class="lk">${ic('lock',12)} Managed by WMS policy</span>`:'';
 const row=(l,s,c)=>`<div class="prow"><div class="pl">${l}${s?`<small>${s}</small>`:''}</div>${c}</div>`;
 return `<div style="padding-bottom:20px">
 <div class="pref-sec"><h3>${ic('net')} Update source${lk}</h3>
  ${row('Source','Where this device looks for update packages and catalog metadata.',sel('source',[['dell','Dell Update Catalog (cloud)'],['wms','WMS repository',S.wms==='none'],['share','Local / network share']]))}
  ${p.source==='share'?row('Share path','UNC path containing a Dell OTA catalog (catalog.xml + packages).',`<input class="inp" data-pref="share" value="${esc(p.share)}" ${d}>`):''}
  ${row('Use system proxy','Uses the WinHTTP proxy configured on the device.',tg('proxy'))}</div>
 <div class="pref-sec"><h3>${ic('download')} Check &amp; download${lk}</h3>
  ${row('Check for updates',null,sel('freq',[['startup','At startup'],['daily','Daily'],['weekly','Weekly'],['manual','Manually only']]))}
  ${row('Download updates automatically','Pre-downloads packages so installs complete faster in the maintenance window.',tg('autoDl'))}
  ${row('On metered connections',null,sel('metered',[['pause','Pause downloads'],['crit','Download critical only'],['allow','Allow all downloads']]))}</div>
 <div class="pref-sec"><h3>${ic('pkg')} Installation${lk}</h3>
  ${row('Install automatically',null,sel('auto',[['off','Off – notify only'],['crit','Critical only'],['critrec','Critical & recommended'],['all','All updates']]))}
  ${row('Maintenance window','Automatic and scheduled installs only run in this window.',`<span class="tgw"><input class="inp" style="min-width:0;width:96px" type="time" data-pref="winStart" value="${p.winStart}" ${d}> – <input class="inp" style="min-width:0;width:96px" type="time" data-pref="winEnd" value="${p.winEnd}" ${d}></span>`)}
  ${row('Defer optional updates',null,sel('defer',[['0','Don\'t defer'],['7','7 days'],['14','14 days'],['30','30 days']]))}
  ${row('When a restart is required',null,sel('restart',[['notify','Notify signed-in user'],['auto','Restart automatically in window'],['never','Never restart automatically']]))}
  ${row('Allow user to postpone restart','Up to 3 times, 1 hour each.',tg('postpone'))}</div>
 <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-act="prefReset" ${d}>Restore defaults</button><button class="btn primary" data-act="prefSave" ${d}>Save</button></div></div>`}

/* Details drawer */
function vDrawer(){const i=item(S.drawer);if(!i)return '';
 const latest=i.versions[0][0],idx=i.versions.findIndex(v=>v[0]===i.cur);
 const secs=[['fixes','Fixes & Enhancements'],['info','Important Information'],['compat','Compatible Systems'],['integrity','Download & Integrity'],['versions','All Versions']];
 const v=i.next||i.cur,file=`${i.name.replace(/\s+/g,'')}_${v.split(' ')[0]}.exe`;
 const sec={fixes:`<h4>Fixes &amp; Enhancements</h4><ul>${i.fixes.map(f=>`<li>${f}</li>`).join('')}</ul>`,
  info:`<h4>Important Information</h4><p>${i.info}</p>${i.proc?`<p>${ic('warn',14)} <b>${i.proc}</b> is running and will be closed during installation.</p>`:''}<p>Install impact: ${impact(i.impact)}${S.wf?' — with Write Filter ON this update is applied in UWF Servicing Mode.':''}</p>`,
  compat:`<h4>Compatible Systems</h4><ul>${COMPAT.map(c=>`<li>${c}</li>`).join('')}</ul><h4 style="margin-top:14px">Supported Operating Systems</h4><ul><li>Windows 11 IoT Enterprise LTSC 2024</li><li>Windows 10 IoT Enterprise LTSC 2021</li></ul>`,
  integrity:`<h4>Download &amp; Integrity</h4><p><b>File name:</b> ${file}<br><b>File size:</b> ${fmtMB(i.size)}<br><b>Publisher:</b> ${i.vendor} · repackaged &amp; signed by Dell Inc.</p><p>Packages are verified against the catalog checksum before install; mismatches are discarded and re-downloaded.</p><p><b>SHA-256:</b></p><p class="mono">${sha(i.id+v)}</p>`,
  versions:`<h4>All Versions</h4><table class="grid"><thead><tr><th>Version</th><th>Release date</th><th></th></tr></thead><tbody>${i.versions.map((x,k)=>`<tr><td>${x[0]} ${x[0]===latest?'<span class="mtag b">Latest</span>':''} ${x[0]===i.cur?'<span class="mtag g">Installed</span>':''}</td><td class="muted">${fmtD(x[1])}</td><td>${k===idx+1&&!managed()?`<button class="link" data-act="rollback" data-id="${i.id}">${ic('undo',12)} Roll back</button>`:''}</td></tr>`).join('')}</tbody></table>`}[S.dsec];
 const L=managed();
 return `<div class="drawer"><div class="dr-scroll">
  <button class="btn sm" data-act="closeDrawer">${ic('back',14)} Back</button>
  <h2>${i.name} ${v}</h2>
  <div class="dmeta"><div><span>Package ID: </span>${i.pkg}</div><div><span>Importance: </span>${IMP[i.imp]}</div><div><span>Version: </span>${v}</div>
   <div><span>Release date: </span>${fmtD(i.date)}</div><div><span>Category: </span>${CATL[i.cat]}</div><div><span>Size: </span>${fmtMB(i.size)}</div>
   <div><span>Installed: </span>${i.cur}</div><div><span>Impact: </span>${impact(i.impact)}</div><div><span>Vendor: </span>${i.vendor}</div></div>
  <p class="desc">${i.desc}</p>
  <div class="dr-body"><nav class="dr-nav">${secs.map(([k,l])=>`<button class="${S.dsec===k?'active':''}" data-act="dsec" data-sec="${k}">${l}</button>`).join('')}</nav><div class="dr-sec">${sec}</div></div>
 </div>
 <div class="dr-foot">${i.next?(L?`<span class="note">${ic('lock',14)} ${i.wms?'Assigned by WMS · installs '+windowLabel():'Not assigned by WMS policy'}</span>`

function vModal(){const m=S.modal;if(!m)return '';
 if(m.type==='preflight'){const size=m.jobs.reduce((a,j)=>a+j.item.size,0),restart=m.jobs.some(j=>j.item.impact==='restart');

  const extra=(m.servicing?`<div class="banner ok" style="margin-top:12px">${ic('wf',18)}<div>UWF Servicing Mode completed. Write Filter is <b>ON</b> again and changes were committed.</div></div>`:'')
   +(rp.length&&!m.dl?`<div class="banner warn" style="margin-top:12px">${ic('power',18)}<div><b>Restart required</b> to finish installing ${rp.map(i=>i.name).join(', ')}.${m.countdown!=null?` Restarting automatically in <b>${m.countdown}s</b>…`:''}</div></div>`:'')
   +(S.wms!=='none'&&!m.dl?`<p style="font-size:12px;color:#9fb0c5;margin-top:10px">${ic('check',12)} Results reported to WMS.</p>`:'');

  return dlg(t,m.servicing?'Applied in UWF Servicing Mode':'',rows+extra,foot)}
 if(m.type==='schedule'){const ids=m.ids;
  return dlg('Schedule installation',`${ids.length} update${ids.length>1?'s':''} · ${fmtMB(ids.map(item).reduce((a,i)=>a+i.size,0))}`,
   `<label class="opt"><input type="radio" name="when" data-act="mopt" data-k="when" data-v="window" ${m.when==='window'?'checked':''}><div>Next maintenance window<small>${windowLabel()} (from Preferences)</small></div></label>
    <label class="opt"><input type="radio" name="when" data-act="mopt" data-k="when" data-v="custom" ${m.when==='custom'?'checked':''}><div>Choose date &amp; time<small><input class="inp" type="datetime-local" data-mf="custom" value="${m.custom}" style="margin-top:6px" ${m.when==='custom'?'':'disabled'}></small></div></label>
    <div class="sec-t">Options</div>
    <label class="opt"><input type="checkbox" data-act="mopt" data-k="prefetch" ${m.prefetch?'checked':''}><div>Download now<small>Packages are downloaded and verified in the background so the window is used only for installing.</small></div></label>
    ${S.wf?`<div class="banner warn">${ic('wf',18)}<div>Write Filter is ON — the scheduled install will run in UWF Servicing Mode.</div></div>`:''}`,

 if(m.type==='wf'){return dlg(`Turn Write Filter ${S.wf?'OFF':'ON'}?`,'A system restart is required for changes to take effect.',
   `<p style="font-size:13px;color:#cfd9e6;line-height:1.5">${S.wf?'With the Write Filter OFF, changes persist across restarts and software updates can be installed. Remember to turn it back ON after updating.':'With the Write Filter ON, changes are discarded at restart and software updates cannot be installed.'}</p>`,
   `<button class="btn" data-act="mClose">Cancel</button><button class="btn primary" data-act="wfGo">${ic('power',14)} Restart now</button>`)}

function vReimage(m){const img=S.os.images.find(x=>x.id===m.img),steps=['Select image','Keep settings','Pre-flight','Confirm'];
 const stepper=`<div class="stepper">${steps.map((s,k)=>`<div class="${k+1===m.step?'on':k+1<m.step?'done':''}">${k+1}. ${s}</div>`).join('')}</div>`;
 let body='',next='';
 if(m.step===1){body=S.os.images.filter(x=>x.id!==S.os.cur.id).map(x=>`<label class="opt"><input type="radio" name="img" data-act="mopt" data-k="img" data-v="${x.id}" ${m.img===x.id?'checked':''}><div><b style="font-weight:500">${x.label}</b> ${x.latest?'<span class="mtag b">Latest · Recommended</span>':''}${x.id<S.os.cur.id?'<span class="mtag a">Older than installed</span>':''}<small>Build ${x.build} · ${fmtD(x.date)} · ${fmtMB(x.size)}</small></div></label>`).join('')
   +`<p style="font-size:12px;color:#9fb0c5;margin-top:8px">Currently installed: ${S.os.cur.label} (build ${S.os.cur.build}). Images are matched to service tag ${DEVICE.tag}.</p>`;next='Next'}
 if(m.step===2){const o=(k,t,s,dis)=>`<label class="opt ${dis?'dis':''}"><input type="checkbox" data-act="mopt" data-k="${k}" ${m[k]&&!dis?'checked':''} ${dis?'disabled':''}><div>${t}<small>${s}</small></div></label>`;
  body=o('keepWms','Keep WMS registration','Device re-registers to the same WMS server and group after imaging.',S.wms==='none')
   +o('keepDacc','Keep DACC configuration','Application Launch Manager entries, Write Filter exclusions, auto-login and shortcuts.')
   +o('keepNet','Keep network & Wi‑Fi profiles','Static IP, proxy and saved wireless networks.')
   +`<div class="warnbox">${ic('warn',18)}<div><b>Everything else on the system drive will be erased</b> — local user profiles, files and any applications not included in ${img.label}.</div></div>`;next='Next'}
 if(m.step===3){body=checksHTML(m);next='Next'}
 if(m.step===4){body=`<div class="warnbox">${ic('warn',18)}<div>The device will download ${img.label} (${fmtMB(img.size)}), restart into <b>Dell OS Recovery</b> and reimage. This takes about 25 minutes and cannot be cancelled once imaging starts.</div></div>
  <p style="font-size:13px;margin:12px 0 6px">Type the service tag <b>${DEVICE.tag}</b> to confirm:</p><input class="inp" style="width:100%" data-mf="tag" value="${esc(m.tag)}" placeholder="Service tag" autocomplete="off">`;}
 const canNext=m.step===3?checksOk(m):m.step===1?!!m.img:true;
 return dlg('Reimage device',`${img?img.label:''}`,stepper+body,
  `${m.step>1?'<button class="btn ghost" data-act="riBack">Back</button>':''}<span class="grow"></span><button class="btn" data-act="mClose">Cancel</button>`+
  (m.step<4?`<button class="btn primary" data-act="riNext" ${canNext?'':'disabled'}>${next}</button>`:`<button class="btn danger" id="riGo" data-act="riGo" ${m.tag.trim().toUpperCase()===DEVICE.tag?'':'disabled'}>Erase &amp; reimage</button>`),true)}

/* ================= Pre-flight ================= */
function preflight(list,{reimage}={}){
 const size=list.filter(i=>!i.downloaded).reduce((a,i)=>a+i.size,0),c=[];
 const needRestart=reimage||S.wf||list.some(i=>i.impact==='restart');
 if(S.net==='offline'){c.push(size?{s:'fail',t:'Network',d:'No connection to the update source. Connect to a network and try again.'}:{s:'pass',t:'Network',d:'Offline — all packages are already downloaded.'})}
 else if(S.net==='metered'&&S.prefs.metered!=='allow'&&size)c.push({s:'warn',t:'Network · metered connection',d:`${fmtMB(size)} will be downloaded over a metered connection.`,ack:'metered',ackT:'Allow download over metered connection'});
 else c.push({s:'pass',t:'Network',d:`${srcName()} reachable (38 ms)`});
 const need=reimage?size:size*1.6;
 c.push({s:'pass',t:'Storage',d:reimage?`${fmtMB(size)} will be staged to the recovery partition · 9.5 GB available`:`${fmtMB(need)} needed (download + extraction) · ${DEVICE.freeGB} GB free`});
 if(S.ac)c.push({s:'pass',t:'Power',d:'AC power connected'});
 else c.push(needRestart?{s:'fail',t:'Power',d:`Battery at 35%. Connect AC power — ${reimage?'reimaging':'restart-required updates'} need AC power or at least 50% battery.`}:{s:'warn',t:'Power',d:'On battery (35%). Live updates can proceed; keep the device powered on.'});
 if(S.wf)c.push({s:'fail',t:'Write Filter is ON',d:'Disable the Write Filter (restart required) before applying updates.'});
 else c.push({s:'pass',t:'Write Filter',d:'OFF — updates are applied directly.'});
 const run=list.filter(i=>i.proc);
 if(reimage)c.push({s:'warn',t:'Running apps & sessions',d:'All apps and VDI sessions will be closed and local data erased.',ack:'apps',ackT:'I understand local data will be erased'});
 else if(run.length)c.push({s:'warn',t:'Running apps',d:`${run.map(i=>i.proc).join(', ')} will be closed during installation.`,ack:'apps',ackT:'Users have saved their work — close these apps'});
 else c.push({s:'pass',t:'Running apps',d:'No conflicting apps running.'});
 c.push({s:'pass',t:'Package integrity',d:'Signed by Dell Inc.; SHA-256 checksum verified before install.'});
 return c}

function animateChecks(){const m=S.modal;if(!m||!m.checks)return;m.shown=0;
 const t=setInterval(()=>{if(S.modal!==m){clearInterval(t);return}m.shown++;renderModal();if(m.shown>=m.checks.length)clearInterval(t)},380)}

function openPreflight(jobs,title,by){
 S.modal={type:'preflight',jobs,title,by,checks:preflight(jobs.map(j=>j.item)),shown:0,acks:{},autoRestart:S.prefs.restart==='auto'};S.drawer=null;render();animateChecks()}
const mkJobs=ids=>ids.map(item).filter(i=>i&&i.next).map(i=>({item:i,from:i.cur,to:i.next,kind:'update'}));

/* ================= Install engine ================= */
const jobRows=jobs=>`<div class="jlist">${jobs.map((j,k)=>`<div class="jr" id="jr${k}" data-st="wait"><div class="top"><span class="jr-ic">${ic('clock',16)}</span><span class="n">${j.item.name} ${j.to}</span><span class="s">${fmtMB(j.item.size)}</span></div><div class="jr-t">Queued</div><div class="bar"><i></i></div></div>`).join('')}</div>`;
function setRow(k,st,p,t){const e=document.getElementById('jr'+k);if(!e)return;e.dataset.st=st;e.querySelector('.bar i').style.width=p+'%';e.querySelector('.jr-t').textContent=t;
 e.querySelector('.jr-ic').innerHTML=st==='dl'?ic('download',16):st==='ok'?`<span style="color:#6fcf5a">${ic('checkc',16)}</span>`:st==='fail'?`<span style="color:#ef5350">${ic('xc',16)}</span>`:st==='cancel'?ic('skip',16):spin()}
function setOverall(p,t){const b=document.getElementById('ov-bar'),x=document.getElementById('ov-t');if(b)b.style.width=p+'%';if(x&&t)x.textContent=t}
function setCancel(on){const b=document.getElementById('pg-cancel');if(b)b.disabled=!on}

async function runJobs(jobs,{servicing=false,dlOnly=false}={}){
 S.cancel=false;const res=[],n=jobs.length;let failIdx=S.failNext&&!dlOnly?Math.min(1,n-1):-1;
 for(let k=0;k<n;k++){const j=jobs[k],it=j.item;
  if(S.cancel){setRow(k,'cancel',0,'Cancelled');res.push({j,st:'cancelled'});continue}
  if(!it.downloaded||j.kind==='rollback'){setCancel(!servicing);const steps=25,dur=Math.min(2600,600+it.size*4);
   for(let p=0;p<=steps;p++){if(S.cancel)break;const pc=p/steps*100;setRow(k,'dl',pc,`Downloading… ${fmtMB(it.size*pc/100)} of ${fmtMB(it.size)}`);setOverall(((k+pc/100*(dlOnly?1:.55))/n)*100,`Downloading ${it.name} (${k+1} of ${n})`);await sleep(dur/steps)}
   if(S.cancel){setRow(k,'cancel',0,'Cancelled');res.push({j,st:'cancelled'});continue}}
  setCancel(false);setRow(k,'verify',100,'Verifying SHA-256 checksum and signature…');await sleep(550);
  if(dlOnly){setRow(k,'ok',100,'Downloaded and verified');res.push({j,st:'ok'});continue}
  let failed=false;
  for(let p=0;p<=100;p+=10){setRow(k,'inst',p,j.kind==='rollback'?`Rolling back to ${j.to}… ${p}%`:`Installing silently… ${p}%`);setOverall(((k+.55+p/100*.45)/n)*100,`Installing ${it.name} (${k+1} of ${n})`);await sleep(130);
   if(k===failIdx&&p>=60){failed=true;break}}
  if(failed){const err=`Installer exited with code 1603. Changes were rolled back — ${j.from} remains installed.`;setRow(k,'fail',100,err);res.push({j,st:'fail',err});S.failNext=false;syncProto()}
  else{setRow(k,'ok',100,it.impact==='restart'&&!servicing?'Installed — restart required':'Installed');res.push({j,st:'ok'})}}
 setOverall(100,'Finished');return res}

function finishJobs(res,by,{servicing=false,dlOnly=false}={}){
 res.forEach(r=>{const it=r.j.item;
  if(dlOnly){if(r.st==='ok')it.downloaded=true;return}
  if(r.st==='ok'){S.history.unshift({d:new Date(),name:it.name,from:r.j.from,to:r.j.to,r:r.j.kind==='rollback'?'rb':'ok',by,rep:S.wms!=='none'});
   it.cur=r.j.to;it.downloaded=false;
   if(r.j.kind==='rollback'){it.next=it.versions[0][0];it.skipped=true}else it.next=null;
   if(it.impact==='restart'&&!servicing)it.restartPending=true;S.sel.delete(it.id);
   if(S.scheduled){S.scheduled.ids=S.scheduled.ids.filter(x=>x!==it.id);if(!S.scheduled.ids.length)S.scheduled=null}}
  else if(r.st==='fail')S.history.unshift({d:new Date(),name:it.name,from:r.j.from,to:r.j.to,r:'fail',err:'1603 – fatal error during installation, rolled back',by,rep:S.wms!=='none'})});
 if(dlOnly)return;
 const ok=res.filter(r=>r.st==='ok').length,bad=res.filter(r=>r.st==='fail').length;
 if(ok||bad)notify(bad?`${ok} installed, ${bad} failed`:`${ok} update${ok>1?'s':''} installed`,res.map(r=>`${r.j.item.name} ${r.j.to}${r.st==='fail'?' (failed)':''}`).join(', '),'updates')}

async function progressRun(jobs,by,{dlOnly=false,autoRestart=false}={}){
 S.modal={type:'progress',locked:true};S.drawer=null;render();
 $('#modal').classList.add('show');$('#modal').innerHTML=dlg(dlOnly?'Downloading updates':`Installing ${jobs.length} update${jobs.length>1?'s':''}`,'Packages are installed silently. You can keep working; apps being updated will be closed.',
  `<div style="margin-bottom:14px"><div id="ov-t" style="font-size:13px;margin-bottom:8px">Preparing…</div><div class="bar big"><i id="ov-bar"></i></div></div>`+jobRows(jobs),
  `<span class="grow">Cancel is available while downloading.</span><button class="btn" id="pg-cancel" data-act="pgCancel">Cancel</button>`,true);
 const res=await runJobs(jobs,{dlOnly});await sleep(400);
 finishJobs(res,by,{dlOnly});
 S.modal={type:'result',res,dl:dlOnly};
 if(autoRestart&&restartPending().length&&!dlOnly){S.modal.countdown=5;const m=S.modal;const t=setInterval(()=>{if(S.modal!==m){clearInterval(t);return}m.countdown--;if(m.countdown<=0){clearInterval(t);restartDevice()}else renderModal()},1000)}
 render()}

const ov=$('#overlay');
async function boot(text,ms,logo=true){ov.classList.add('show');ov.innerHTML=`<div class="boot">${logo?dellLogo(true):''}<span class="spinner"></span><div class="boot-t">${text}</div></div>`;await sleep(ms)}
function ovHide(){ov.classList.remove('show');ov.innerHTML=''}
const setStep=(k,st)=>{const e=document.getElementById('sv'+k);if(!e)return;e.dataset.st=st;e.querySelector('.sic').innerHTML=st==='done'?ic('check',16,2.2):st==='run'?spin():ic('clock',14)};

async function servicing(jobs,by){
 S.modal=null;S.drawer=null;S.notifOpen=false;render();
 await boot('Restarting into UWF Servicing Mode…',1800);
 const steps=['Restarted into servicing mode','Write Filter temporarily disabled · overlay cleared','Installing updates','Committing changes and re-enabling Write Filter','Restarting device'];
 ov.innerHTML=`<div class="svc"><div class="svc-box">${dellLogo(false)}<h2>Servicing in progress</h2><div class="lead">Do not turn off your device. It is locked until servicing completes and will restart automatically.</div>
  <ul class="svc-steps">${steps.map((s,k)=>`<li id="sv${k}" data-st="wait"><span class="sic">${ic('clock',14)}</span>${s}</li>`).join('')}</ul>
  <div style="margin-bottom:12px"><div id="ov-t" style="font-size:13px;margin-bottom:8px;color:#cfd9e6">Preparing…</div><div class="bar big"><i id="ov-bar"></i></div></div>${jobRows(jobs)}</div></div>`;
 setStep(0,'run');await sleep(700);setStep(0,'done');setStep(1,'run');await sleep(900);setStep(1,'done');setStep(2,'run');
 const res=await runJobs(jobs,{servicing:true});
 setStep(2,'done');setStep(3,'run');await sleep(1400);setStep(3,'done');setStep(4,'run');await sleep(900);
 await boot('Restarting…',1400,false);await boot('',1300);
 ovHide();finishJobs(res,by,{servicing:true});
 S.win='open';S.view='updates';S.tab='available';S.modal={type:'result',res,servicing:true};render();
 const bad=res.filter(r=>r.st==='fail').length;
 osToast(bad?'Some updates failed':'Updates installed',bad?`${bad} update failed during servicing. Open DACC to retry.`:`${res.length} update${res.length>1?'s':''} installed in UWF Servicing Mode. Write Filter is ON.`)}

async function restartDevice(){
 S.modal=null;S.drawer=null;S.notifOpen=false;render();
 await boot('Restarting…',1500,false);
 const rp=restartPending();rp.forEach(i=>i.restartPending=false);
 const wfChanged=S.wfPending!==null,back=S.view;
 if(wfChanged){S.wf=S.wfPending;S.wfPending=null}
 await boot('',1400);ovHide();S.win='closed';render();syncProto();
 if(rp.length)osToast('Updates finished installing',`${rp.map(i=>i.name).join(', ')} ${rp.length>1?'are':'is'} up to date.${S.wf?'':' Remember to turn the Write Filter back ON.'}`);
 else if(wfChanged&&!S.wf&&back==='updates'){openDACC('updates');toast('Write Filter is OFF. You can now install updates.')}
 else osToast('Dell Application Control Center',`Write Filter is ${S.wf?'ON':'OFF'}.`)}

async function reimageRun(){
 const img=S.os.images.find(x=>x.id===S.modal.img),m=S.modal;const job={item:{name:img.label,size:img.size,downloaded:false,impact:'reimage'},to:'',from:S.os.cur.label,kind:'image'};
 S.modal={type:'progress',locked:true};render();
 $('#modal').classList.add('show');$('#modal').innerHTML=dlg('Preparing reimage',img.label,`<div style="margin-bottom:14px"><div id="ov-t" style="font-size:13px;margin-bottom:8px">Preparing…</div><div class="bar big"><i id="ov-bar"></i></div></div>`+jobRows([job]),`<button class="btn" id="pg-cancel" data-act="pgCancel">Cancel</button>`,true);
 S.cancel=false;

 const pc=q('#proto-car');if(pc)pc.innerHTML='&#9662;';
 const b=q('body');if(b)b.classList.remove('fb-picking');
 q('#fb-embedded').textContent=JSON.stringify({ver:FB_VER,savedAt:nowISO(),reviewer:F.reviewer,items:F.items}).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n'+doc.outerHTML}
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;tmp.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
async function sendBack(){if(needName(sendBack))return;
 if(!F.items.length&&!confirm('You have no feedback yet. Save a copy anyway?'))return;
 ui.menu=false;const html=buildFile(),safe=(F.reviewer||'reviewer').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'reviewer';
 const name=`DACC-OTA-Prototype_${safe}_${stamp()}.html`;
 if(window.showSaveFilePicker){try{const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'HTML file',accept:{'text/html':['.html']}}]});
   const wr=await h.createWritable();await wr.write(html);await wr.close();F.lastSent=nowISO();persist();ui.dlg={t:'sent',name:h.name,where:'Saved to the location you chose.',count:F.items.length};draw();return}
  catch(err){if(err&&err.name==='AbortError')return}}
 download(html,name,'text/html');F.lastSent=nowISO();persist();ui.dlg={t:'sent',name,where:'',count:F.items.length};draw()}
function importFiles(){const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='.html,.htm,.json';
 inp.onchange=async()=>{let files=0,added=0,bad=0;
  for(const f of inp.files){try{const txt=await f.text();let data=null;
    if(/\.json$/i.test(f.name))data=JSON.parse(txt);
    else{const d=new DOMParser().parseFromString(txt,'text/html'),s=d.getElementById('fb-embedded');data=s?JSON.parse(s.textContent):null}
    if(!data){bad++;continue}added+=merge(Array.isArray(data)?data:data.items);files++}catch(_){bad++}}
  draw();toastFb(`Imported ${added} new/updated item${added!==1?'s':''} from ${files} file${files!==1?'s':''}${bad?` · ${bad} file(s) skipped`:''}.`)};
 inp.click()}
function rowsData(){return F.items.map((it,i)=>({'#':i+1,Reviewer:it.reviewer,Role:it.role||'',Type:it.type,Priority:it.priority,Status:STL[it.status]||it.status,Comment:it.text,Response:it.note||'',
 Screen:it.screen,'Pinned element':it.pin?it.pin.label:'','Write Filter':it.ctx?(it.ctx.wf?'ON':'OFF'):'',WMS:it.ctx?(WMSL[it.ctx.wms]||it.ctx.wms):'',Network:it.ctx?it.ctx.net:'',
 Created:fmt(it.created),Updated:fmt(it.updated),'Prototype version':it.ver||'',ID:it.id}))}
function exportCsv(){const R=rowsData();if(!R.length){toastFb('No feedback to export.');return}const H=Object.keys(R[0]);
 const q=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`};
 download('\ufeff'+[H.map(q).join(','),...R.map(r=>H.map(h=>q(r[h])).join(','))].join('\r\n'),`DACC-OTA-feedback_${stamp()}.csv`,'text/csv');toastFb('CSV exported.')}
function mdText(){const by={};F.items.forEach((it,i)=>{(by[it.screen]=by[it.screen]||[]).push([it,i+1])});
 let s=`# DACC OTA prototype – reviewer feedback\n\nExported ${fmt(nowISO())} · ${F.items.length} item(s) · prototype v${FB_VER}\n`;
 Object.keys(by).forEach(k=>{s+=`\n## ${k}\n\n`;by[k].forEach(([it,n])=>{s+=`- **#${n} [${it.type} · ${it.priority} · ${STL[it.status]||it.status}]** ${it.text.replace(/\s*\n+\s*/g,' ')}${it.pin?` _(on “${it.pin.label}”)_`:''} — ${it.reviewer}, ${fmt(it.created)}\n${it.note?`  - Response: ${it.note.replace(/\s*\n+\s*/g,' ')}\n`:''}`})});
 return s}
function exportMd(){if(!F.items.length){toastFb('No feedback to export.');return}download(mdText(),`DACC-OTA-feedback_${stamp()}.md`,'text/markdown');toastFb('Markdown exported.')}
function copyText(){if(!F.items.length){toastFb('No feedback to copy.');return}const t=mdText();
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;tmp.appendChild(ta);ta.select();try{document.execCommand('copy');toastFb('Feedback copied — paste it into Teams or email.')}catch(_){toastFb('Copy failed. Use Export Markdown instead.')}ta.remove()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toastFb('Feedback copied — paste it into Teams or email.'),fallback);else fallback()}

/* ---------- events ---------- */
root.addEventListener('click',ev=>{
 const pin=ev.target.closest('[data-fpin]');if(pin){openEdit(pin.dataset.fpin);return}
 const b=ev.target.closest('[data-fa]');if(!b)return;ev.preventDefault();const id=b.dataset.id;
 switch(b.dataset.fa){
  case 'fab':if(ui.open)ui.open=false;else ui.menu=!ui.menu;break;
  case 'pin':if(!needName(startPick))startPick();return;
  case 'general':if(!needName(()=>openNew(null)))openNew(null);return;
  case 'panel':ui.menu=false;ui.open=true;break;
  case 'panelClose':ui.open=false;break;
  case 'send':sendBack();return;
  case 'import':importFiles();return;
  case 'csv':exportCsv();return;
  case 'md':exportMd();return;
  case 'copy':copyText();return;
  case 'rename':openName();return;
  case 'tour':startTour();return;
  case 'tourNext':tourGo(1);return;
  case 'tourPrev':tourGo(-1);return;
  case 'tourEnd':endTour();return;
  case 'nameSave':case 'nameTour':{const d=ui.dlg.draft,nm=String(d.name||'').trim();if(!nm){toastFb('Please enter your name.');uiEl.querySelector('#fb-name')?.focus();return}
   const old=F.reviewer;if(old&&old!==nm)F.items.forEach(it=>{if(it.reviewer===old){it.reviewer=nm;it.updated=nowISO()}});
   F.reviewer=nm;F.role=String(d.role||'').trim();persist();ui.dlg=null;const cb=b.dataset.fa==='nameTour'?startTour:ui.after;ui.after=null;draw();if(cb)cb();return}
  case 'dlgClose':ui.dlg=null;if(ui.wasOpen){ui.open=true;ui.wasOpen=false}break;
  case 'seg':ui.dlg.draft[b.dataset.k]=b.dataset.v;break;
  case 'save':save();return;
  case 'del':delItem(id);return;
  case 'edit':openEdit(id);return;
  case 'goto':gotoItem(F.items.find(x=>x.id===id));return;
 }
 draw()});
root.addEventListener('input',ev=>{ev.stopPropagation();const t=ev.target;if(t.dataset.fd&&ui.dlg)ui.dlg.draft[t.dataset.fd]=t.value});
root.addEventListener('change',ev=>{ev.stopPropagation();const t=ev.target;
 if(t.dataset.fd&&ui.dlg){ui.dlg.draft[t.dataset.fd]=t.value;return}
 const k=t.dataset.ff;if(!k)return;if(k==='pins')ui.pins=t.checked;else if(k==='screen')ui.flt.screen=t.checked;else ui.flt[k]=t.value;draw()});
root.addEventListener('keydown',ev=>{ev.stopPropagation();
 if(ev.key==='Escape'){if(ui.dlg&&(ui.dlg.t!=='name'||F.reviewer))ui.dlg=null;else if(ui.open)ui.open=false;else ui.menu=false;draw()}
 if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)&&ui.dlg&&ui.dlg.t==='edit')save()});

/* pin picking */
const hl=document.createElement('div');hl.className='fb-pick-hl';
function pickTarget(ev){let t=ev.target;if(!t||t.nodeType!==1||t.closest('#fb-root'))return null;const s=t.closest('svg');if(s)t=s.parentElement;
 return t===document.body||t===document.documentElement?null:t}
window.addEventListener('mousemove',ev=>{if(!ui.picking)return;const t=pickTarget(ev);if(!t){hl.remove();return}
 const r=t.getBoundingClientRect();Object.assign(hl.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});if(!hl.isConnected)tmp.appendChild(hl)},true);
['mousedown','mouseup','pointerdown','pointerup','dblclick'].forEach(tp=>window.addEventListener(tp,ev=>{if(ui.picking&&!(ev.target.closest&&ev.target.closest('#fb-root'))){ev.preventDefault();ev.stopImmediatePropagation()}},true));
window.addEventListener('click',ev=>{if(!ui.picking||(ev.target.closest&&ev.target.closest('#fb-root')))return;ev.preventDefault();ev.stopImmediatePropagation();
 const t=pickTarget(ev);stopPick();if(!t)return;const r=t.getBoundingClientRect();
 openNew({sel:selOf(t),zone:zoneOf(t),rx:r.width?Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)):.5,ry:r.height?Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height)):.5,label:labelOf(t)})},true);
window.addEventListener('keydown',ev=>{if(ui.tour==null)return;
 const k=ev.key,act=k==='Escape'?endTour:k==='ArrowRight'?()=>tourGo(1):k==='ArrowLeft'?()=>tourGo(-1):null;
 if(act){ev.preventDefault();ev.stopImmediatePropagation();act()}},true);
window.addEventListener('keydown',ev=>{if(ui.picking&&ev.key==='Escape'){ev.stopImmediatePropagation();stopPick();if(ui.wasOpen){ui.open=true;ui.wasOpen=false;draw()}}},true);
window.addEventListener('beforeunload',ev=>{if(F.items.length&&unsent()){ev.preventDefault();ev.returnValue=''}});

/* opened from SharePoint / Teams preview? */
if(/sharepoint\.com|teams\.microsoft|officeapps|\.office\.com/i.test(location.host)){
 const w=document.createElement('div');w.className='fb-warn';w.innerHTML='This prototype is opened inside a web preview, so it may not work and feedback may not be saved. <b>Download the file and open it from your computer.</b> <button style="margin-left:12px;color:#fff;text-decoration:underline">Dismiss</button>';
 w.querySelector('button').onclick=()=>w.remove();tmp.appendChild(w)}

/* boot */
load();draw();
if(!F.reviewer)setTimeout(()=>{if(!F.reviewer&&!ui.dlg)openName()},1900);
})();
</script>
